name: "Build Android APK \u2014 Samsung A16"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-native/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set gradlew executable
        working-directory: android-native
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-native
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk_path
        run: |
          APK=$(find android-native -name "*.apk" -type f | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClawBreak-A16-debug
          path: ${{ steps.apk_path.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "ClawBreak A16 \u2014 Build #${{ github.run_number }}"
          body: |
            ## ClawBreak for Samsung Galaxy A16 (Android 14 / ARM64)

            **Install on your A16:**
            1. Download `app-debug.apk` below
            2. On your A16: Settings \u2192 Apps \u2192 Special app access \u2192 Install unknown apps \u2192 enable your browser
            3. Tap the downloaded APK and install

            **How it connects:**
            Auto-fetches live cloud server URL from `endpoint.json`. Falls back to GitHub Pages PWA offline.
          files: ${{ steps.apk_path.outputs.path }}
          fail_on_unmatched_files: false
