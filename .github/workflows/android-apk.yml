name: Build Android APK — Samsung A16

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: Bootstrap gradle wrapper jar
        working-directory: android-native
        run: |
          # If gradle-wrapper.jar is missing, generate it
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-native
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find android-native/app/build/outputs/apk -name '*.apk' 2>/dev/null | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"
          ls -lh "$APK" || echo "not found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClawBreak-A16-debug
          path: android-native/app/build/outputs/apk/debug/
          retention-days: 90

      - name: Release APK on main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find android-native/app/build/outputs/apk -name '*.apk' | head -1)
          gh release create "apk-build-${{ github.run_number }}" \
            --title "ClawBreak A16 — Build #${{ github.run_number }}" \
            --notes "## ClawBreak for Samsung Galaxy A16 (Android 14 / ARM64)

Install:
1. Download app-debug.apk below
2. A16: Settings > Apps > Special access > Install unknown apps > enable Files
3. Tap APK and install

Auto-connects to live cloud server via endpoint.json (falls back to GitHub Pages if offline)." \
            "$APK" || true
