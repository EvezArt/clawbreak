name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Start server
        run: python3 server.py &
        env:
          CLAWBREAK_LLM_API_KEY: test
      - name: Health check
        run: sleep 3 && curl -f http://localhost:8080/health
